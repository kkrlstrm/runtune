name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests -q
      # the core must import with no third-party packages
      - run: python -S -c "import sys; sys.path.insert(0, '.'); import runtune.cli, runtune.derive.constraints, runtune.lifecycle.promoter"
