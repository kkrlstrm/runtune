<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1140" viewBox="0 0 720 912" role="img" aria-labelledby="title desc">
  <title id="title">The RunTune learning loop</title>
  <desc id="desc">Real agent runs create evidence. Success reinforces capability, failure adds constraint, and drift adjusts routing. RunTune proposes measured changes for human approval, which updates the harness for future runs.</desc>
  <style>
    :root { color-scheme: light dark; }
    .ink { fill: #172033; }
    .muted { fill: #5b6475; }
    .line { stroke: #aab4c4; }
    .accent { fill: #2457d6; }
    .accent-line { stroke: #2457d6; }
    .panel { fill: #f5f7fb; stroke: #d4dbe6; }
    .panel-strong { fill: #eef3ff; stroke: #9eb8f6; }
    .panel-warm { fill: #fff8e8; stroke: #e8c86e; }
    .branch-success { fill: #eaf8f1; stroke: #75c59d; }
    .branch-failure { fill: #fff0ef; stroke: #e69b93; }
    .branch-drift { fill: #f2efff; stroke: #aa9be5; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eef3fb; }
      .muted { fill: #aeb9ca; }
      .line { stroke: #526070; }
      .accent { fill: #8aadff; }
      .accent-line { stroke: #8aadff; }
      .panel { fill: #182231; stroke: #3f4d60; }
      .panel-strong { fill: #1b2d52; stroke: #6689df; }
      .panel-warm { fill: #332c1c; stroke: #987f38; }
      .branch-success { fill: #173529; stroke: #4e9f78; }
      .branch-failure { fill: #3a2425; stroke: #aa665f; }
      .branch-drift { fill: #2c2843; stroke: #8073bd; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { font-size: 26px; font-weight: 700; letter-spacing: 3px; }
    .label { font-size: 30px; font-weight: 750; letter-spacing: 1.5px; }
    .body { font-size: 28px; font-weight: 500; }
    .small { font-size: 26px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="accent"/>
    </marker>
  </defs>

  <!-- A narrower viewBox keeps type legible when GitHub constrains this image on mobile. -->
  <g transform="scale(.8)">

  <!-- Closed loop: the side rail returns future runs to the next evidence cycle. -->
  <path d="M 110 1010 V 1055 Q 110 1085 140 1085 H 805 Q 875 1085 875 1015 V 150 Q 875 105 825 105 H 700" fill="none" class="accent-line" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="450" y="1118" text-anchor="middle" class="eyebrow muted">TUNE THE HARNESS, NOT THE MODEL.</text>

  <rect x="255" y="72" width="390" height="86" rx="18" class="panel" stroke-width="2"/>
  <text x="450" y="125" text-anchor="middle" class="label ink">REAL AGENT RUNS</text>
  <path d="M450 158 V202" fill="none" class="accent-line" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="278" y="213" width="344" height="78" rx="18" class="panel-strong" stroke-width="2"/>
  <text x="450" y="263" text-anchor="middle" class="label ink">EVIDENCE</text>
  <path d="M450 291 V325 H165 V353 M450 325 V353 M450 325 H735 V353" fill="none" class="line" stroke-width="3" stroke-linecap="round"/>

  <rect x="45" y="365" width="240" height="128" rx="18" class="branch-success" stroke-width="2"/>
  <text x="165" y="412" text-anchor="middle" class="label ink">SUCCESS</text>
  <text x="165" y="454" text-anchor="middle" class="body muted">reinforce</text>
  <text x="165" y="482" text-anchor="middle" class="body muted">capability</text>

  <rect x="330" y="365" width="240" height="128" rx="18" class="branch-failure" stroke-width="2"/>
  <text x="450" y="412" text-anchor="middle" class="label ink">FAILURE</text>
  <text x="450" y="454" text-anchor="middle" class="body muted">add</text>
  <text x="450" y="482" text-anchor="middle" class="body muted">constraint</text>

  <rect x="615" y="365" width="240" height="128" rx="18" class="branch-drift" stroke-width="2"/>
  <text x="735" y="412" text-anchor="middle" class="label ink">DRIFT</text>
  <text x="735" y="454" text-anchor="middle" class="body muted">adjust</text>
  <text x="735" y="482" text-anchor="middle" class="body muted">routing</text>

  <path d="M165 493 V531 H450 M450 493 V531 M735 493 V531 H450 V565" fill="none" class="line" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="225" y="578" width="450" height="174" rx="22" class="panel-strong" stroke-width="2"/>
  <text x="450" y="633" text-anchor="middle" class="label ink">RUNTUNE</text>
  <path d="M310 660 H590" class="line" stroke-width="2"/>
  <text x="330" y="707" text-anchor="middle" class="body muted">derive</text>
  <text x="450" y="707" text-anchor="middle" class="body muted">propose</text>
  <text x="570" y="707" text-anchor="middle" class="body muted">measure</text>
  <path d="M450 752 V793" fill="none" class="accent-line" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="260" y="805" width="380" height="72" rx="36" class="panel-warm" stroke-width="2"/>
  <text x="450" y="851" text-anchor="middle" class="label ink">HUMAN APPROVAL</text>
  <path d="M450 877 V917" fill="none" class="accent-line" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="205" y="930" width="490" height="104" rx="20" class="panel" stroke-width="2"/>
  <text x="450" y="974" text-anchor="middle" class="label ink">HARNESS</text>
  <text x="450" y="1013" text-anchor="middle" class="small muted">skills · sub-agents · guards · routes</text>
  <path d="M450 1034 V1052" fill="none" class="accent-line" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="1074" text-anchor="middle" class="eyebrow muted">FUTURE RUNS</text>
  </g>
</svg>
