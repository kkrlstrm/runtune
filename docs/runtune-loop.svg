<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
  <title id="title">The RunTune learning loop</title>
  <desc id="desc">Real agent runs produce evidence. Success reinforces capability, failure adds constraint, and drift adjusts routing. RunTune proposes measured changes for human approval. The harness shapes future runs, which feed the next cycle.</desc>
  <style>
    :root { color-scheme: light dark; }
    .ink { fill: #172033; }
    .muted { fill: #5b6475; }
    .line { stroke: #9da9b9; }
    .accent { fill: #2457d6; }
    .accent-line { stroke: #2457d6; }
    .panel { fill: #f5f7fb; stroke: #d4dbe6; }
    .panel-strong { fill: #eef3ff; stroke: #9eb8f6; }
    .panel-warm { fill: #fff8e8; stroke: #e8c86e; }
    .branch-success { fill: #eaf8f1; stroke: #75c59d; }
    .branch-failure { fill: #fff0ef; stroke: #e69b93; }
    .branch-drift { fill: #f2efff; stroke: #aa9be5; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eef3fb; }
      .muted { fill: #aeb9ca; }
      .line { stroke: #526070; }
      .accent { fill: #8aadff; }
      .accent-line { stroke: #8aadff; }
      .panel { fill: #182231; stroke: #3f4d60; }
      .panel-strong { fill: #1b2d52; stroke: #6689df; }
      .panel-warm { fill: #332c1c; stroke: #987f38; }
      .branch-success { fill: #173529; stroke: #4e9f78; }
      .branch-failure { fill: #3a2425; stroke: #aa665f; }
      .branch-drift { fill: #2c2843; stroke: #8073bd; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2.5px; }
    .label { font-size: 25px; font-weight: 750; letter-spacing: 1.3px; }
    .body { font-size: 22px; font-weight: 500; }
    .small { font-size: 21px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="accent"/>
    </marker>
  </defs>

  <!-- The return path starts at Future Runs and ends at the next real-agent run. -->
  <path d="M500 928 H670 Q700 928 700 898 V90 Q700 78 688 78 H536" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <rect x="190" y="42" width="340" height="70" rx="16" class="panel" stroke-width="2"/>
  <text x="360" y="86" text-anchor="middle" class="label ink">REAL AGENT RUNS</text>
  <path d="M360 112 V152" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="210" y="160" width="300" height="68" rx="16" class="panel-strong" stroke-width="2"/>
  <text x="360" y="203" text-anchor="middle" class="label ink">EVIDENCE</text>
  <path d="M360 228 V263 H140 M360 263 H580 M140 263 V282 M360 263 V282 M580 263 V282" fill="none" class="line" stroke-width="3" stroke-linecap="round"/>

  <rect x="40" y="292" width="200" height="118" rx="16" class="branch-success" stroke-width="2"/>
  <text x="140" y="334" text-anchor="middle" class="label ink">SUCCESS</text>
  <text x="140" y="370" text-anchor="middle" class="body muted">reinforce</text>
  <text x="140" y="394" text-anchor="middle" class="body muted">capability</text>

  <rect x="260" y="292" width="200" height="118" rx="16" class="branch-failure" stroke-width="2"/>
  <text x="360" y="334" text-anchor="middle" class="label ink">FAILURE</text>
  <text x="360" y="370" text-anchor="middle" class="body muted">add</text>
  <text x="360" y="394" text-anchor="middle" class="body muted">constraint</text>

  <rect x="480" y="292" width="200" height="118" rx="16" class="branch-drift" stroke-width="2"/>
  <text x="580" y="334" text-anchor="middle" class="label ink">DRIFT</text>
  <text x="580" y="370" text-anchor="middle" class="body muted">adjust</text>
  <text x="580" y="394" text-anchor="middle" class="body muted">routing</text>

  <path d="M140 410 V426 H360 M360 410 V426 M580 410 V426 H360" fill="none" class="line" stroke-width="3" stroke-linecap="round"/>
  <path d="M360 426 V466" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="160" y="474" width="400" height="130" rx="18" class="panel-strong" stroke-width="2"/>
  <text x="360" y="519" text-anchor="middle" class="label ink">RUNTUNE</text>
  <path d="M245 542 H475" class="line" stroke-width="2"/>
  <text x="260" y="574" text-anchor="middle" class="body muted">derive</text>
  <text x="360" y="574" text-anchor="middle" class="body muted">propose</text>
  <text x="460" y="574" text-anchor="middle" class="body muted">measure</text>
  <path d="M360 604 V646" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="195" y="654" width="330" height="60" rx="30" class="panel-warm" stroke-width="2"/>
  <text x="360" y="692" text-anchor="middle" class="label ink">HUMAN APPROVAL</text>
  <path d="M360 714 V754" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="140" y="762" width="440" height="88" rx="18" class="panel" stroke-width="2"/>
  <text x="360" y="799" text-anchor="middle" class="label ink">HARNESS</text>
  <text x="360" y="828" text-anchor="middle" class="small muted">skills · sub-agents · guards · routes</text>
  <path d="M360 850 V890" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="220" y="898" width="280" height="60" rx="30" class="panel-strong" stroke-width="2"/>
  <text x="360" y="936" text-anchor="middle" class="label ink">FUTURE RUNS</text>
  <text x="360" y="990" text-anchor="middle" class="eyebrow muted">TUNE THE HARNESS, NOT THE MODEL.</text>
</svg>
