<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" aria-labelledby="title desc">
  <title id="title">The RunTune learning loop</title>
  <desc id="desc">Real agent runs produce evidence. Success reinforces capability, failure adds constraint, and drift adjusts routing. RunTune applies human-approved changes to the harness and future runs restart the cycle.</desc>
  <style>
    :root { color-scheme: light dark; }
    .ink { fill: #172033; }
    .muted { fill: #5b6475; }
    .line { stroke: #9da9b9; }
    .accent { fill: #2457d6; }
    .accent-line { stroke: #2457d6; }
    .panel { fill: #f5f7fb; stroke: #d4dbe6; }
    .panel-strong { fill: #eef3ff; stroke: #9eb8f6; }
    .panel-warm { fill: #fff8e8; stroke: #e8c86e; }
    .branch-success { fill: #eaf8f1; stroke: #75c59d; }
    .branch-failure { fill: #fff0ef; stroke: #e69b93; }
    .branch-drift { fill: #f2efff; stroke: #aa9be5; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eef3fb; }
      .muted { fill: #aeb9ca; }
      .line { stroke: #526070; }
      .accent { fill: #8aadff; }
      .accent-line { stroke: #8aadff; }
      .panel { fill: #182231; stroke: #3f4d60; }
      .panel-strong { fill: #1b2d52; stroke: #6689df; }
      .panel-warm { fill: #332c1c; stroke: #987f38; }
      .branch-success { fill: #173529; stroke: #4e9f78; }
      .branch-failure { fill: #3a2425; stroke: #aa665f; }
      .branch-drift { fill: #2c2843; stroke: #8073bd; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .label { font-size: 15px; font-weight: 750; letter-spacing: .7px; }
    .branch-label { font-size: 13px; font-weight: 750; letter-spacing: .45px; }
    .body { font-size: 12px; font-weight: 500; }
    .small { font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="accent"/>
    </marker>
  </defs>

  <!-- Future Runs begins the return path; the loop remains outside every label. -->
  <path d="M338 403 H344 Q352 403 352 395 V32 Q352 32 344 32 H256" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <rect x="90" y="14" width="160" height="36" rx="10" class="panel" stroke-width="2"/>
  <text x="180" y="37" text-anchor="middle" class="label ink">REAL AGENT RUNS</text>
  <path d="M180 50 V68" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="110" y="76" width="140" height="36" rx="10" class="panel-strong" stroke-width="2"/>
  <text x="180" y="99" text-anchor="middle" class="label ink">EVIDENCE</text>
  <path d="M180 112 V124 H64 M180 124 H296 M64 124 V128 M180 124 V128 M296 124 V128" fill="none" class="line" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="12" y="136" width="104" height="64" rx="11" class="branch-success" stroke-width="2"/>
  <text x="64" y="160" text-anchor="middle" class="branch-label ink">SUCCESS</text>
  <text x="64" y="178" text-anchor="middle" class="body muted">reinforce</text>
  <text x="64" y="192" text-anchor="middle" class="body muted">capability</text>

  <rect x="128" y="136" width="104" height="64" rx="11" class="branch-failure" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" class="branch-label ink">FAILURE</text>
  <text x="180" y="178" text-anchor="middle" class="body muted">add</text>
  <text x="180" y="192" text-anchor="middle" class="body muted">constraint</text>

  <rect x="244" y="136" width="104" height="64" rx="11" class="branch-drift" stroke-width="2"/>
  <text x="296" y="160" text-anchor="middle" class="branch-label ink">DRIFT</text>
  <text x="296" y="178" text-anchor="middle" class="body muted">adjust</text>
  <text x="296" y="192" text-anchor="middle" class="body muted">routing</text>

  <path d="M64 200 V214 H180 M180 200 V214 M296 200 V214 H180" fill="none" class="line" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180 214 V232" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="70" y="240" width="220" height="56" rx="13" class="panel-strong" stroke-width="2"/>
  <text x="180" y="262" text-anchor="middle" class="label ink">RUNTUNE</text>
  <path d="M106 272 H254" class="line" stroke-width="2"/>
  <text x="118" y="287" text-anchor="middle" class="body muted">derive</text>
  <text x="180" y="287" text-anchor="middle" class="body muted">propose</text>
  <text x="242" y="287" text-anchor="middle" class="body muted">measure</text>
  <path d="M180 296 V314" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="95" y="322" width="170" height="34" rx="17" class="panel-warm" stroke-width="2"/>
  <text x="180" y="344" text-anchor="middle" class="label ink">HUMAN APPROVAL</text>
  <path d="M180 356 V364 Q180 368 176 368 H104 Q100 368 100 372 V374" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <rect x="22" y="382" width="155" height="50" rx="12" class="panel" stroke-width="2"/>
  <text x="100" y="403" text-anchor="middle" class="label ink">HARNESS</text>
  <text x="100" y="420" text-anchor="middle" class="small muted">skills · agents · guards · routes</text>
  <path d="M177 407 H197" fill="none" class="accent-line" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="205" y="382" width="133" height="50" rx="12" class="panel-strong" stroke-width="2"/>
  <text x="272" y="403" text-anchor="middle" class="label ink">FUTURE RUNS</text>
  <text x="180" y="452" text-anchor="middle" class="eyebrow muted">TUNE THE HARNESS, NOT THE MODEL.</text>
</svg>
