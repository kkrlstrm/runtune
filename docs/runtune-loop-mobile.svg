<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">The RunTune learning loop</title>
  <desc id="desc">Real agent runs create evidence. Success, failure, and drift merge into RunTune. RunTune verifies a candidate before human approval and the harness, producing future runs that close the loop.</desc>
  <style>
    :root { color-scheme: light dark; }
    .ink { fill: #172033; }
    .muted { fill: #5b6475; }
    .line { stroke: #9da9b9; }
    .accent { fill: #2457d6; }
    .accent-line { stroke: #2457d6; }
    .panel { fill: #f5f7fb; stroke: #d4dbe6; }
    .panel-strong { fill: #eef3ff; stroke: #9eb8f6; }
    .panel-warm { fill: #fff8e8; stroke: #e8c86e; }
    .branch-success { fill: #eaf8f1; stroke: #75c59d; }
    .branch-failure { fill: #fff0ef; stroke: #e69b93; }
    .branch-drift { fill: #f2efff; stroke: #aa9be5; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eef3fb; }
      .muted { fill: #aeb9ca; }
      .line { stroke: #526070; }
      .accent { fill: #8aadff; }
      .accent-line { stroke: #8aadff; }
      .panel { fill: #182231; stroke: #3f4d60; }
      .panel-strong { fill: #1b2d52; stroke: #6689df; }
      .panel-warm { fill: #332c1c; stroke: #987f38; }
      .branch-success { fill: #173529; stroke: #4e9f78; }
      .branch-failure { fill: #3a2425; stroke: #aa665f; }
      .branch-drift { fill: #2c2843; stroke: #8073bd; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { font-size: 7.3px; font-weight: 700; letter-spacing: .35px; }
    .label { font-size: 13px; font-weight: 750; letter-spacing: .5px; }
    .branch-label { font-size: 12px; font-weight: 750; letter-spacing: .35px; }
    .body { font-size: 10px; font-weight: 500; }
    .micro { font-size: 8px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="accent"/>
    </marker>
  </defs>

  <!-- Future Runs begins the return path, which stays outside all labels. -->
  <path d="M245 339 H352 Q356 339 356 335 V26 Q356 26 352 26 H266" fill="none" class="accent-line" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <rect x="100" y="10" width="160" height="32" rx="9" class="panel" stroke-width="2"/>
  <text x="180" y="31" text-anchor="middle" class="label ink">REAL AGENT RUNS</text>
  <path d="M180 42 V56" fill="none" class="accent-line" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="110" y="64" width="140" height="32" rx="9" class="panel-strong" stroke-width="2"/>
  <text x="180" y="85" text-anchor="middle" class="label ink">EVIDENCE</text>
  <path d="M180 96 V103 H64 M180 103 H296 M64 103 V104 M180 103 V104 M296 103 V104" fill="none" class="line" stroke-width="2" stroke-linecap="round"/>

  <rect x="12" y="110" width="104" height="41" rx="10" class="branch-success" stroke-width="2"/>
  <text x="64" y="127" text-anchor="middle" class="branch-label ink">SUCCESS</text>
  <text x="64" y="142" text-anchor="middle" class="body muted">reinforce capability</text>

  <rect x="128" y="110" width="104" height="41" rx="10" class="branch-failure" stroke-width="2"/>
  <text x="180" y="127" text-anchor="middle" class="branch-label ink">FAILURE</text>
  <text x="180" y="142" text-anchor="middle" class="body muted">add constraint</text>

  <rect x="244" y="110" width="104" height="41" rx="10" class="branch-drift" stroke-width="2"/>
  <text x="296" y="127" text-anchor="middle" class="branch-label ink">DRIFT</text>
  <text x="296" y="142" text-anchor="middle" class="body muted">adjust routing</text>

  <!-- All outcome paths merge before the sole arrow into RunTune. -->
  <path d="M64 151 V156 H180 M180 151 V156 M296 151 V156 H180" fill="none" class="line" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 156 V172" fill="none" class="accent-line" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="115" y="180" width="130" height="42" rx="11" class="panel-strong" stroke-width="2"/>
  <text x="180" y="199" text-anchor="middle" class="label ink">RUNTUNE</text>
  <text x="180" y="214" text-anchor="middle" class="micro muted">derive · propose · compare</text>

  <!-- The next directed step intentionally lands on Human Approval to the left. -->
  <path d="M180 222 V230" fill="none" class="accent-line" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="113" y="235" width="134" height="28" rx="9" class="panel" stroke-width="2"/>
  <text x="180" y="247" text-anchor="middle" class="branch-label ink">VERIFY</text>
  <text x="180" y="257" text-anchor="middle" class="micro muted">tests · quality · cost</text>
  <path d="M180 263 V267 H105 V274" fill="none" class="accent-line" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="40" y="278" width="130" height="40" rx="11" class="panel-warm" stroke-width="2"/>
  <text x="105" y="294" text-anchor="middle" class="label ink">HUMAN</text>
  <text x="105" y="307" text-anchor="middle" class="body ink">APPROVAL</text>

  <path d="M170 298 H190" fill="none" class="accent-line" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="198" y="278" width="122" height="40" rx="11" class="panel" stroke-width="2"/>
  <text x="259" y="294" text-anchor="middle" class="label ink">HARNESS</text>
  <text x="259" y="307" text-anchor="middle" class="micro muted">skills · agents · guards · routes</text>

  <!-- Approval and harness form one layer, then jointly shape future runs. -->
  <path d="M105 318 V324 H180 M259 318 V324 H180" fill="none" class="line" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 324 V327" fill="none" class="accent-line" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="115" y="330" width="130" height="18" rx="11" class="panel-strong" stroke-width="2"/>
  <text x="180" y="343" text-anchor="middle" class="body ink">FUTURE RUNS</text>
  <text x="180" y="356" text-anchor="middle" class="eyebrow muted">TUNE THE HARNESS, NOT THE MODEL.</text>
</svg>
