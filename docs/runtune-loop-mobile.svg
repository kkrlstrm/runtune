<svg xmlns="http://www.w3.org/2000/svg" width="360" height="310" viewBox="0 0 360 310" role="img" aria-labelledby="title desc">
  <title id="title">The RunTune learning loop</title>
  <desc id="desc">Real agent runs create evidence. Success reinforces capability, failure adds constraint, and drift adjusts routing. RunTune turns human-approved changes into a harness for future runs.</desc>
  <style>
    :root { color-scheme: light dark; }
    .ink { fill: #172033; }
    .muted { fill: #5b6475; }
    .line { stroke: #9da9b9; }
    .accent { fill: #2457d6; }
    .accent-line { stroke: #2457d6; }
    .panel { fill: #f5f7fb; stroke: #d4dbe6; }
    .panel-strong { fill: #eef3ff; stroke: #9eb8f6; }
    .panel-warm { fill: #fff8e8; stroke: #e8c86e; }
    .branch-success { fill: #eaf8f1; stroke: #75c59d; }
    .branch-failure { fill: #fff0ef; stroke: #e69b93; }
    .branch-drift { fill: #f2efff; stroke: #aa9be5; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eef3fb; }
      .muted { fill: #aeb9ca; }
      .line { stroke: #526070; }
      .accent { fill: #8aadff; }
      .accent-line { stroke: #8aadff; }
      .panel { fill: #182231; stroke: #3f4d60; }
      .panel-strong { fill: #1b2d52; stroke: #6689df; }
      .panel-warm { fill: #332c1c; stroke: #987f38; }
      .branch-success { fill: #173529; stroke: #4e9f78; }
      .branch-failure { fill: #3a2425; stroke: #aa665f; }
      .branch-drift { fill: #2c2843; stroke: #8073bd; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { font-size: 9px; font-weight: 700; letter-spacing: .9px; }
    .label { font-size: 13px; font-weight: 750; letter-spacing: .5px; }
    .branch-label { font-size: 12px; font-weight: 750; letter-spacing: .35px; }
    .body { font-size: 10px; font-weight: 500; }
    .micro { font-size: 8px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="accent"/>
    </marker>
  </defs>

  <!-- Future Runs begins the return path, which stays outside the content. -->
  <path d="M350 269 H352 Q356 269 356 265 V28 Q356 28 352 28 H266" fill="none" class="accent-line" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <rect x="100" y="12" width="160" height="32" rx="9" class="panel" stroke-width="2"/>
  <text x="180" y="33" text-anchor="middle" class="label ink">REAL AGENT RUNS</text>
  <path d="M180 44 V58" fill="none" class="accent-line" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="110" y="66" width="140" height="32" rx="9" class="panel-strong" stroke-width="2"/>
  <text x="180" y="87" text-anchor="middle" class="label ink">EVIDENCE</text>
  <path d="M180 98 V105 H64 M180 105 H296 M64 105 V106 M180 105 V106 M296 105 V106" fill="none" class="line" stroke-width="2" stroke-linecap="round"/>

  <rect x="12" y="112" width="104" height="43" rx="10" class="branch-success" stroke-width="2"/>
  <text x="64" y="129" text-anchor="middle" class="branch-label ink">SUCCESS</text>
  <text x="64" y="143" text-anchor="middle" class="body muted">reinforce capability</text>

  <rect x="128" y="112" width="104" height="43" rx="10" class="branch-failure" stroke-width="2"/>
  <text x="180" y="129" text-anchor="middle" class="branch-label ink">FAILURE</text>
  <text x="180" y="143" text-anchor="middle" class="body muted">add constraint</text>

  <rect x="244" y="112" width="104" height="43" rx="10" class="branch-drift" stroke-width="2"/>
  <text x="296" y="129" text-anchor="middle" class="branch-label ink">DRIFT</text>
  <text x="296" y="143" text-anchor="middle" class="body muted">adjust routing</text>

  <path d="M64 155 V160 H180 M180 155 V160 M296 155 V160 H180" fill="none" class="line" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 160 V176" fill="none" class="accent-line" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="10" y="184" width="95" height="52" rx="11" class="panel-strong" stroke-width="2"/>
  <text x="57" y="205" text-anchor="middle" class="label ink">RUNTUNE</text>
  <text x="57" y="221" text-anchor="middle" class="micro muted">derive · propose</text>
  <text x="57" y="230" text-anchor="middle" class="micro muted">measure</text>
  <path d="M105 210 H124" fill="none" class="accent-line" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="132" y="184" width="96" height="52" rx="11" class="panel-warm" stroke-width="2"/>
  <text x="180" y="204" text-anchor="middle" class="label ink">HUMAN</text>
  <text x="180" y="221" text-anchor="middle" class="body ink">APPROVAL</text>
  <path d="M228 210 H247" fill="none" class="accent-line" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="255" y="184" width="95" height="52" rx="11" class="panel" stroke-width="2"/>
  <text x="302" y="205" text-anchor="middle" class="label ink">HARNESS</text>
  <text x="302" y="221" text-anchor="middle" class="micro muted">skills · agents</text>
  <text x="302" y="230" text-anchor="middle" class="micro muted">guards · routes</text>
  <path d="M302 236 V250" fill="none" class="accent-line" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="255" y="258" width="95" height="22" rx="10" class="panel-strong" stroke-width="2"/>
  <text x="302" y="273" text-anchor="middle" class="body ink">FUTURE RUNS</text>
  <text x="180" y="304" text-anchor="middle" class="eyebrow muted">TUNE THE HARNESS, NOT THE MODEL.</text>
</svg>
