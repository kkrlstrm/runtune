[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtune"
version = "0.2.0"
description = "A runtime learning loop for coding agents: turns Claude Code, Codex and model-router runs into governed, measured changes to the agent harness. It tunes the harness, not the model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Kai Karlstrom" }]
keywords = ["runtime-learning", "agent-harness", "claude-code", "codex", "openrouter", "ai-agents", "agent-telemetry", "guardrails", "skills", "llmops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
card = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kkrlstrm/runtune"
Issues = "https://github.com/kkrlstrm/runtune/issues"
Evidence = "https://github.com/kkrlstrm/runtune/blob/main/docs/EVIDENCE.md"

[project.scripts]
runtune = "runtune.cli:main"

[tool.setuptools.packages.find]
include = ["runtune*"]

[tool.setuptools.package-data]
runtune = ["data/*.jsonl"]
